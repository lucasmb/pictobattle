name: Deploy PictoBattle

on:
  push:
    branches: [main]
  workflow_dispatch:

env:
  REGISTRY: ghcr.io
  # IMAGE_NAME_SERVER: ${{ github.repository }}-server
  # IMAGE_NAME_WEB: ${{ github.repository }}-web
  IMAGE_BASE: ${{ github.repository }}
  PORT: 4000

jobs:
  # 1. Extract version once
  setup:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.get_version.outputs.VERSION }}
      lower_image_base: ${{ steps.lowercase.outputs.IMAGE_BASE }}
    steps:
      - uses: actions/checkout@v4
      - id: get_version
        run: echo "VERSION=$(node -p "require('./package.json').version")" >> $GITHUB_OUTPUT

      # This ensures the image name is lowercase (Required by Docker)
      - id: lowercase
        run: echo "IMAGE_BASE=${GITHUB_REPOSITORY@L}" >> $GITHUB_OUTPUT # 2. Build images in parallel

  build-and-push:
    needs: setup
    runs-on: ubuntu-latest
    strategy:
      matrix:
        include:
          - service: server
            context: .
            dockerfile: apps/server/Dockerfile
          - service: web
            context: .
            dockerfile: apps/web/Dockerfile

    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to the Container registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ needs.setup.outputs.lower_image_base }}-${{ matrix.service }}
          tags: |
            type=raw,value=latest
            type=raw,value=${{ needs.setup.outputs.version }}
            type=sha,format=short

      - name: Build and push
        uses: docker/build-push-action@v5
        with:
          context: ${{ matrix.context }}
          file: ${{ matrix.dockerfile }}
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          build-args: |
            VITE_SERVER_URL=${{ secrets.VITE_SERVER_URL }}

  deploy:
    needs: [setup, build-and-push]
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Copy docker-compose.yml
        uses: appleboy/scp-action@v1
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          port: ${{ secrets.VPS_SSH_PORT }}
          source: "docker-compose.yml"
          target: "${{ secrets.VPS_PATH }}"

      - name: Deploy to VPS
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          port: ${{ secrets.VPS_SSH_PORT }}
          script: |
            cd ${{ secrets.VPS_PATH }}

            # Create .env file safely
            cat <<EOF > .env
            PORT=${{ env.PORT }}
            CLIENT_URL=${{ secrets.CLIENT_URL }}
            VITE_SERVER_URL=${{ secrets.VITE_SERVER_URL }}
            SERVER_IMAGE=${{ env.REGISTRY }}/${{ needs.setup.outputs.lower_image_base }}-server:${{ needs.setup.outputs.version }}
            WEB_IMAGE=${{ env.REGISTRY }}/${{ needs.setup.outputs.lower_image_base }}-web:${{ needs.setup.outputs.version }}
            EOF

            # Log in to registry on VPS
            echo "${{ secrets.GITHUB_TOKEN }}" | docker login ${{ env.REGISTRY }} -u ${{ github.actor }} --password-stdin

            docker compose pull
            docker compose up -d
            docker image prune -f
