services:
  server:
    image: ${SERVER_IMAGE:-pictobattle-server:latest}
    container_name: pictobattle-server
    restart: unless-stopped
    networks:
      - caddy-network
    environment:
      - NODE_ENV=production
      - PORT=4000
      - CLIENT_URL=${CLIENT_URL}
      - REDIS_HOST=redis
    # We remove 'ports' because Caddy accesses this via the internal network
    security_opt:
      - no-new-privileges:true
    deploy:
      resources:
        limits:
          cpus: "0.50"
          memory: 512M
    healthcheck:
      test: [
          "CMD",
          "wget",
          "--no-verbose",
          "--tries=1",
          "--spider",
          "http://localhost:${PORT:-4000}/health",
        ] # Adjust to your health endpoint
      interval: 30s
      timeout: 10s
      retries: 3
    depends_on:
      redis:
        condition: service_healthy
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

  redis:
    image: redis:8-alpine # Specified version for stability
    container_name: pictobattle-redis
    restart: unless-stopped
    command: redis-server --appendonly yes # Enables data persistence
    networks:
      - caddy-network
    volumes:
      - redis_data:/data
    deploy:
      resources:
        limits:
          memory: 256M
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5
    logging:
      driver: "json-file"
      options:
        max-size: "5m"

  web:
    image: ${WEB_IMAGE:-pictobattle-web:latest}
    build:
      context: .
      dockerfile: apps/web/Dockerfile
      args:
        - VITE_SERVER_URL=${VITE_SERVER_URL:-http://localhost:4000}
    container_name: pictobattle-web
    restart: unless-stopped
    networks:
      - caddy-network
    volumes:
      - pictobattle_web_static:/usr/share/caddy/html
    security_opt:
      - no-new-privileges:true
    deploy:
      resources:
        limits:
          cpus: "0.25"
          memory: 128M
    logging:
      driver: "json-file"
      options:
        max-size: "5m"

networks:
  caddy-network:
    external: true

volumes:
  redis_data:
  pictobattle_web_static:
    name: pictobattle_web_static
