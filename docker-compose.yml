services:
  app:
    image: ${APP_IMAGE:-pictobattle:latest}
    build:
      context: .
    container_name: pictobattle-app
    restart: unless-stopped
    networks:
      - caddy-network
    environment:
      - NODE_ENV=production
      - PORT=4000
      - CLIENT_URL=${CLIENT_URL}
      - REDIS_HOST=redis
    # No 'ports': Caddy reaches this via the internal network
    security_opt:
      - no-new-privileges:true
    deploy:
      resources:
        limits:
          cpus: "0.50"
          memory: 512M
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:4000/health"]
      interval: 30s
      timeout: 10s
      retries: 3
    depends_on:
      redis:
        condition: service_healthy
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

  redis:
    image: redis:8-alpine
    container_name: pictobattle-redis
    restart: unless-stopped
    command: redis-server --appendonly yes
    networks:
      - caddy-network
    volumes:
      - redis_data:/data
    deploy:
      resources:
        limits:
          memory: 256M
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5
    logging:
      driver: "json-file"
      options:
        max-size: "5m"

networks:
  caddy-network:
    external: true

volumes:
  redis_data:
