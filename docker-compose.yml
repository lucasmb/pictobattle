services:
  app:
    image: ${APP_IMAGE:-pictobattle:latest}
    build:
      context: .
    container_name: pictobattle-app
    restart: unless-stopped
    networks:
      - caddy-network
    environment:
      - NODE_ENV=production
      - PORT=4000
      - CLIENT_URL=${CLIENT_URL}
      - REDIS_HOST=redis
    # No 'ports': Caddy reaches this via the internal network
    security_opt:
      - no-new-privileges:true
    deploy:
      resources:
        limits:
          cpus: "0.50"
          memory: 512M
    healthcheck:
      # No wget/shell in the hardened image, so probe with node
      test: ["CMD", "node", "-e", "fetch('http://localhost:4000/health').then(r=>process.exit(r.ok?0:1),()=>process.exit(1))"]
      interval: 60s
      timeout: 10s
      retries: 3
    depends_on:
      redis:
        condition: service_healthy
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

  redis:
    image: dhi.io/redis:8
    container_name: pictobattle-redis
    restart: unless-stopped
    # Exec form: no shell in DHI. protected-mode off like the official image (no host ports; only the internal network reaches it)
    command: ["redis-server", "/etc/redis/redis.conf", "--appendonly", "yes", "--protected-mode", "no"]
    security_opt:
      - no-new-privileges:true
    networks:
      - caddy-network
    volumes:
      - redis_data:/data
    deploy:
      resources:
        limits:
          memory: 256M
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5
    logging:
      driver: "json-file"
      options:
        max-size: "5m"

networks:
  caddy-network:
    external: true

volumes:
  redis_data:
