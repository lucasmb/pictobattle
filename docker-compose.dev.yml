# Local test of the production image: http://localhost:4000
services:
  app:
    image: pictobattle:latest
    build:
      context: .
    container_name: pictobattle-app-dev
    environment:
      - NODE_ENV=production
      - PORT=4000
      - CLIENT_URL=${CLIENT_URL:-http://localhost:4000}
      - REDIS_HOST=redis
    ports:
      - "4000:4000"
    depends_on:
      - redis

  redis:
    image: dhi.io/redis:8
    container_name: pictobattle-redis-dev
    command: ["redis-server", "/etc/redis/redis.conf", "--appendonly", "yes", "--protected-mode", "no"]
    ports:
      - "6379:6379"
